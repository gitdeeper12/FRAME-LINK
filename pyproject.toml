[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-link-engine"
version = "1.0.1"
description = "FRAME-LINK: Fatigue Reliability Assessment and Monitoring Extension for Structural Connection Integrity under Cyclic and Dynamic Loading"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"}
]
keywords = [
    "fracture-mechanics", "fatigue-analysis", "paris-erdogan",
    "structural-connections", "welded-joints", "crack-propagation",
    "palmgren-miner", "rainflow-counting", "reliability-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.1",
    "xgboost>=1.5.0",
    "streamlit>=1.12.0",
    "plotly>=5.5.0",
    "pyyaml>=5.4.0",
    "pydantic>=1.9.0"
]

[project.urls]
Homepage = "https://frame-link-v1.netlify.app"
Documentation = "https://frame-link-v1.netlify.app/documentation"
Repository = "https://github.com/gitdeeper12/FRAME-LINK"
Issues = "https://github.com/gitdeeper12/FRAME-LINK/issues"
DOI = "https://doi.org/10.5281/zenodo.20440786"

[project.scripts]
frame-link = "frame_link.cli:main"
frame-link-dashboard = "frame_link.monitoring.app:run"

[tool.setuptools]
packages = ["frame_link"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
frame_link = ["*.yaml", "*.yml", "configs/*"]
