stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.11"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - apt-get update -qq && apt-get install -y -qq libopenblas-dev
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install -r requirements-dev.txt

test:
  stage: test
  script:
    - pytest tests/ -v --cov=frame_link --cov-report=term
    - flake8 frame_link/ tests/ --max-line-length=100
    - mypy frame_link/ --ignore-missing-imports
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'

build:
  stage: build
  script:
    - python -m build
    - pip install twine
    - twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

deploy:
  stage: deploy
  script:
    - pip install twine
    - twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  only:
    - tags

pages:
  stage: deploy
  script:
    - pip install sphinx sphinx-rtd-theme myst-parser
    - cd docs && make html
    - mv _build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main
